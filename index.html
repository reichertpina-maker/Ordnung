<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ordnung">
<title>Ordnung</title>
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#17262b;--mute:#62757b;--line:#d5dde0;--acc:#1f6f78;--accink:#fff;--late:#b3382c;--soon:#a8680f;--ok:#2f7a4d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10181b;--card:#1a2528;--ink:#e8f0f1;--mute:#93a6ab;--line:#2c3a3e;--acc:#5fb7c0;--accink:#08181a;--late:#ff8d80;--soon:#e8b25c;--ok:#7fd1a0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:30px;margin:8px 0 4px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
.item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border-left:6px solid var(--ok);display:flex;gap:12px;align-items:center}
.item.late{border-left-color:var(--late)}.item.soon{border-left-color:var(--soon)}
.info{flex:1;min-width:0;cursor:pointer}
.name{font-weight:600;font-size:18px;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:14px;margin-top:2px}
.due{font-size:15px;margin-top:6px;font-weight:600;color:var(--ok)}
.late .due{color:var(--late)}.soon .due{color:var(--soon)}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:var(--accink);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button.danger{background:transparent;color:var(--late);padding:12px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.done{white-space:nowrap;padding:10px 12px;font-size:15px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:16px 22px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--mute);padding:50px 20px}
dialog{border:0;border-radius:18px;padding:20px;width:calc(100% - 28px);max-width:520px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:14px;color:var(--mute);margin:14px 0 5px}
input,select{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.calc{margin-top:16px;padding:12px;border-radius:10px;background:var(--bg);font-weight:600}
.calc span{display:block;font-weight:400;color:var(--mute);font-size:14px}
.actions{display:flex;gap:10px;margin-top:20px;justify-content:space-between;align-items:center}
.actions .r{display:flex;gap:10px}
.seg{display:flex;gap:6px;margin:0 0 16px}.seg button{flex:1;padding:9px 6px;font-size:14px;background:transparent;color:var(--acc);border:1.5px solid var(--acc)}.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
.err{color:var(--late);font-size:14px;margin-top:10px;min-height:18px}
.link{background:none;color:var(--mute);font-weight:400;font-size:14px;padding:4px 0;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>Ordnung</h1>
  <p class="sub" id="sub"></p>
  <div class="seg" id="seg" role="group" aria-label="Sortierung"><button data-s="due">Fälligkeit</button><button data-s="name">Aufgabe A–Z</button><button data-s="freq">Häufigkeit</button></div>
  <div id="list"></div>
  <button class="link" id="logout" hidden>Abmelden</button>
</main>
<button class="fab" id="add" hidden>+ Aufgabe</button>

<dialog id="login">
  <h2 style="margin:0 0 4px;font-size:22px">Anmelden</h2>
  <label for="l-mail">E-Mail</label>
  <input id="l-mail" type="email" autocomplete="email">
  <label for="l-pw">Passwort</label>
  <input id="l-pw" type="password" autocomplete="current-password">
  <div class="err" id="l-err"></div>
  <div class="actions"><span></span><button id="l-go" type="button">Anmelden</button></div>
</dialog>

<dialog id="dlg">
  <h2 id="dtitle" style="margin:0 0 4px;font-size:22px">Neue Aufgabe</h2>
  <label for="f-name">Aufgabe</label>
  <input id="f-name" placeholder="z. B. Bett beziehen" autocomplete="off">
  <label>Wiederholung: alle …</label>
  <div class="row">
    <input id="f-n" type="number" min="1" value="3" inputmode="numeric">
    <select id="f-u"><option value="d">Tage</option><option value="w" selected>Wochen</option><option value="m">Monate</option><option value="y">Jahre</option></select>
  </div>
  <label for="f-last">Zuletzt erledigt am</label>
  <input id="f-last" type="date">
  <div class="calc">Nächste Fälligkeit<span id="f-next">–</span></div>
  <div class="actions">
    <button class="danger" id="del" type="button">Löschen</button>
    <div class="r"><button class="ghost" id="cancel" type="button">Abbrechen</button><button id="save" type="button">Speichern</button></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== HIER EINTRAGEN (Supabase → Project Settings → API) ======
const SUPABASE_URL='https://eerfbjfgfcbzcjtpxnpi.supabase.co';
const SUPABASE_KEY='sb_publishable_MTjRQdi-qksa5v2PxGv--Q_5LfGd28P';
// ================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let tasks=[],editId=null,me='',sortBy='due';
try{sortBy=localStorage.getItem('ordnung-sort')||'due'}catch(e){}
const days=t=>t.n*({d:1,w:7,m:30,y:365}[t.u]||1);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const UL={d:['Tag','Tage'],w:['Woche','Wochen'],m:['Monat','Monate'],y:['Jahr','Jahre']};
function nextDue(last,n,u){
  if(!last)return null;
  const l=parse(last),d=new Date(l);
  if(u==='d')d.setDate(d.getDate()+n);
  else if(u==='w')d.setDate(d.getDate()+7*n);
  else{const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(u==='y'?12*n:n));const max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max))}
  // Wochentag des letzten Erledigungsdatums beibehalten (nächstgelegenen passenden Tag nehmen).
  // Ausnahme: Abstände unter 7 Tagen, z. B. täglich.
  const total=Math.round((d-l)/864e5);
  if(total>=7){let diff=((l.getDay()-d.getDay())%7+7)%7;if(diff>3)diff-=7;d.setDate(d.getDate()+diff)}
  return d;
}
const fmt=d=>d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const every=(n,u)=>n===1?({w:'jede Woche',d:'jeden Tag',m:'jeden Monat',y:'jedes Jahr'}[u]):`alle ${n} ${UL[u][1]}`;
function status(t){
  const nd=nextDue(t.last,t.n,t.u);
  if(!nd)return{cls:'late',text:'Noch nie erledigt – jetzt fällig',key:-1e9};
  const diff=Math.round((nd-today())/864e5);
  if(diff<0)return{cls:'late',text:`Überfällig seit ${-diff} ${-diff===1?'Tag':'Tagen'} (${fmt(nd)})`,key:diff};
  if(diff===0)return{cls:'soon',text:'Heute fällig',key:diff};
  if(diff===1)return{cls:'soon',text:'Morgen fällig',key:diff};
  return{cls:diff<=3?'soon':'',text:`Fällig am ${fmt(nd)} (in ${diff} Tagen)`,key:diff};
}
function render(){
  const list=$('list');list.innerHTML='';
  const cmp={due:(a,b)=>a.s.key-b.s.key,
    name:(a,b)=>a.t.name.localeCompare(b.t.name,'de',{sensitivity:'base'}),
    freq:(a,b)=>days(a.t)-days(b.t)||a.t.name.localeCompare(b.t.name,'de',{sensitivity:'base'})};
  const rows=tasks.map(t=>({t,s:status(t)})).sort(cmp[sortBy]||cmp.due);
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===sortBy));
  const open=rows.filter(r=>r.s.key<=0).length;
  $('sub').textContent=tasks.length?(open?`${open} ${open===1?'Aufgabe ist':'Aufgaben sind'} fällig`:'Alles erledigt'):'';
  if(!rows.length){list.innerHTML='<div class="empty">Noch keine Aufgaben.<br>Tippe auf „+ Aufgabe“.</div>';return}
  rows.forEach(({t,s})=>{
    const el=document.createElement('div');el.className='item '+s.cls;
    const info=document.createElement('div');info.className='info';
    const nm=document.createElement('div');nm.className='name';nm.textContent=t.name;
    const mt=document.createElement('div');mt.className='meta';
    mt.textContent=every(t.n,t.u)+(t.last?' · zuletzt '+fmt(parse(t.last)):'')+(t.last&&t.lastBy?' von '+(t.lastBy===me?'dir':t.lastBy):'');
    const du=document.createElement('div');du.className='due';du.textContent=s.text;
    info.append(nm,mt,du);info.onclick=()=>openForm(t.id);
    const b=document.createElement('button');b.className='done';b.textContent='Erledigt';
    b.onclick=async()=>{await run(sb.from('tasks').update({last:iso(today()),last_by:me}).eq('id',t.id))};
    el.append(info,b);list.append(el);
  });
}
async function load(){
  const {data,error}=await sb.from('tasks').select('*').order('created_at');
  if(error){$('sub').textContent='Fehler: '+error.message;return}
  tasks=data.map(r=>({id:r.id,name:r.name,n:r.n,u:r.u,last:r.last||'',lastBy:r.last_by||''}));
  render();
}
async function run(q){const {error}=await q;if(error)alert('Speichern fehlgeschlagen: '+error.message);await load()}
function updateCalc(){
  const n=Math.max(1,parseInt($('f-n').value)||1);
  const nd=nextDue($('f-last').value,n,$('f-u').value);
  $('f-next').textContent=nd?fmt(nd):'Trage ein Erledigungsdatum ein';
}
function openForm(id){
  editId=id;const t=tasks.find(x=>x.id===id);
  $('dtitle').textContent=t?'Aufgabe bearbeiten':'Neue Aufgabe';
  $('f-name').value=t?t.name:'';$('f-n').value=t?t.n:3;$('f-u').value=t?t.u:'w';
  $('f-last').value=t?(t.last||''):'';
  $('del').style.visibility=t?'visible':'hidden';
  updateCalc();$('dlg').showModal();
}
$('add').onclick=()=>openForm(null);
$('cancel').onclick=()=>$('dlg').close();
['f-n','f-u','f-last'].forEach(i=>{$(i).addEventListener('input',updateCalc);$(i).addEventListener('change',updateCalc)});
$('save').onclick=async()=>{
  const name=$('f-name').value.trim();
  if(!name){$('f-name').focus();return}
  const rec={name,n:Math.max(1,parseInt($('f-n').value)||1),u:$('f-u').value,last:$('f-last').value||null};
  const cur=tasks.find(x=>x.id===editId);
  if(!cur||(cur.last||null)!==rec.last)rec.last_by=rec.last?me:null;
  const dup=tasks.find(x=>x.id!==editId&&x.name.trim().toLowerCase()===name.toLowerCase());
  if(dup&&!confirm('Es gibt schon eine Aufgabe „'+dup.name+'“. Trotzdem speichern?'))return;
  $('dlg').close();
  await run(cur?sb.from('tasks').update(rec).eq('id',editId):sb.from('tasks').insert(rec));
};
$('del').onclick=async()=>{
  if(confirm('Diese Aufgabe löschen?')){$('dlg').close();await run(sb.from('tasks').delete().eq('id',editId))}
};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{sortBy=b.dataset.s;try{localStorage.setItem('ordnung-sort',sortBy)}catch(e){}render()});
// ---- Anmeldung ----
$('l-go').onclick=async()=>{
  $('l-err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('l-mail').value.trim(),password:$('l-pw').value});
  if(error)$('l-err').textContent='Anmeldung fehlgeschlagen: '+error.message;
};
$('logout').onclick=()=>sb.auth.signOut();
let sub=null;
async function onSession(session){
  const on=!!session;
  $('add').hidden=$('logout').hidden=!on;
  if(!on){tasks=[];render();$('sub').textContent='';if(!$('login').open)$('login').showModal();if(sub){sb.removeChannel(sub);sub=null}return}
  me=(session.user.email||'').split('@')[0];
  if($('login').open)$('login').close();
  await load();
  if(!sub)sub=sb.channel('tasks').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},load).subscribe();
}
sb.auth.onAuthStateChange((_e,s)=>{setTimeout(()=>onSession(s),0)});
sb.auth.getSession().then(({data})=>onSession(data.session));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)load()});
</script>
</body>
</html>
